# LLM Configuration - Choose your AI model provider
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  # Claude (Anthropic): Excellent quality, higher cost
  # DeepSeek: Good quality, much lower cost, better Chinese support
  # Gemini: Fast, multimodal, free tier available
  # Grok: Advanced reasoning, real-time data
  # OpenAI: Industry standard, latest models
  provider: gemini

  # Optional: Specify a model (if not set, uses provider's default)
  # Claude models: claude-sonnet-4-5-20250929, claude-3-5-sonnet-20241022
  # DeepSeek models: deepseek-chat, deepseek-reasoner
  # model: claude-sonnet-4-5-20250929

news:
  # Enable web search tool (uses DuckDuckGo API via LLM tool calling)
  # Note: DuckDuckGo API often returns limited results. RSS feeds are more reliable.
  # Default: false (recommended to keep disabled)
  enable_web_search: false

  # Maximum news items to fetch per source (fetch more for AI to select from)
  max_items_per_source: 10

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior AI industry analyst. Analyze the {total_items} news items above and select between 5 and 20 of the highest-quality items.

      ### SELECTION CRITERIA:
      - ✅ Major releases of generative AI models, LLMs, video models, image models, audio models or multimodal models
      - ✅ New features in creative AI tools such as Kling, Runway, Pika, Luma, Higgsfield, Magnific, Midjourney, Freepik, Sora, Veo, Ideogram, Recraft, Adobe Firefly and similar tools
      - ✅ Practical workflow updates for content creation, advertising, social media, video production, image generation, design, automation and communication agencies
      - ✅ AI agents, coding agents and automation tools only when they introduce concrete new capabilities
      - ✅ API releases, product launches, model upgrades, new creative controls, quality improvements, workflow features or pricing changes
      - ✅ LLM news only when there is a concrete model release, product update, benchmark-relevant capability or practical workflow impact
      - ✅ Prefer hands-on product news over market rumors, generic opinions or vague AI trend articles

      ### SELECTION RULES:
      - Select at least 5 items.
      - Select up to 20 items only if they are genuinely important.
      - Do not force weak news just to reach a high number.
      - It is acceptable to select 5-8 items if the day is quiet.
      - Prefer quality over quantity.
      - Avoid cybersecurity news unless it directly affects generative AI tools or creative workflows.
      - Avoid autonomous vehicles, healthcare, robotics and enterprise-only news unless the item introduces a relevant generative AI model, LLM capability or creative workflow impact.
      - Avoid generic political statements, ethical debates or regulation news unless they directly affect how AI tools can be used by creators, agencies or businesses.
      - Prefer "new model / new feature / new workflow / practical update" over financial news, statistics or generic AI adoption reports.

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12"]

      CRITICAL: Select between 5 and 20 items.

  # Stage 2: Summarization prompt template (complete prompt for creating the digest)
  # Placeholders: {count}, {selected_news}
  stage2_prompt_template: |
      You are a senior AI news editor.

      Create a structured AI news digest from the {count} selected news items below.

      {selected_news}

      PRIVATE EDITORIAL FOCUS:
      {private_focus}

      OUTPUT LANGUAGE:
      Write entirely in Italian.

      OUTPUT FORMAT:
      Return ONLY valid JSON.
      Do not use markdown.
      Do not wrap the JSON in code fences.
      Do not add explanations before or after the JSON.

      JSON SCHEMA:
      {{
        "items": [
          {{
            "title": "Short, clear, readable title in Italian",
            "category": "Short category name",
            "summary": "A substantial but readable summary, around 5-7 lines. Explain what happened, context, relevant details and practical implications.",
            "why_it_matters": "Explain why this matters in practical terms, especially for AI, creative work, communication, automation, tools, models or digital workflows.",
            "source_name": "Source publication name",
            "source_url": "Original source URL"
          }}
        ]
      }}

      RULES:
      - Summarize ALL selected items.
      - Keep each news item independent, because it will be sent as a separate Telegram message.
      - Use clear titles, not academic titles.
      - Keep the summary substantial, around 5-7 lines.
      - Keep the "why_it_matters" section practical and useful.
      - Preserve important numbers, product names, company names, model names, release names and technical details.
      - source_url must be the original URL from the selected item.
      - source_name must be the real publication/source name.
      - Do not invent sources or URLs.
      - Do not create section headers outside the JSON.

      AVOID:
      - Generic statements without specifics.
      - Overly long wall-text paragraphs.
      - Markdown formatting.
      - Markdown links like [Source](URL).
      - HTML formatting.
      - Bullet lists inside JSON fields.
      - Empty or vague categories.
      - Skipping selected news items.
      - Adding commentary outside the JSON.
      - Mentioning internal selection rules or editorial instructions.

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
